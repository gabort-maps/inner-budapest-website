<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Where the polygon differs from its city</title><desc id="desc">Deviation bars show the polygon minus Budapest by age band.</desc>
<style>text{font-family:"Courier New",Courier,monospace;font-variant-numeric:tabular-nums lining-nums}svg>text:nth-of-type(1),svg>text:nth-of-type(2){font-family:Georgia,"Times New Roman",serif}.axis{shape-rendering:crispEdges}</style>
<rect x="0" y="0" width="1600" height="1000" fill="#F1EADC" stroke="none" stroke-width="0" rx="0" opacity="1"/>
<text x="80" y="78" font-size="44" fill="#263238" text-anchor="start" font-weight="500" >Where the polygon differs from its city</text>
<text x="80" y="116" font-size="23" fill="#687377" text-anchor="start" font-weight="400" >Below zero means a smaller share than Budapest</text>
<rect x="1350" y="52" width="170" height="44" fill="#EEE9DF" stroke="#D7D2C7" stroke-width="1" rx="22" opacity="1"/>
<text x="1435" y="82" font-size="16" fill="#263238" text-anchor="middle" font-weight="500" letter-spacing="1.4">MODELLED</text>
<line x1="820" y1="150" x2="820" y2="750" stroke="#263238" stroke-width="2" opacity="1"/>
<text x="570" y="198" font-size="20" fill="#263238" text-anchor="end" font-weight="400" >80+</text>
