<text x="820" y="790" font-size="19" fill="#263238" text-anchor="middle" font-weight="400" >difference from Budapest, percentage points</text>
<path d="M 460 541 L 440 541 L 440 729 L 460 729" fill="none" stroke="#D96642" stroke-width="3" opacity="1"/>
<text x="410" y="620" font-size="19" fill="#263238" text-anchor="end" font-weight="500" ><tspan x="410" dy="0">Every child band</tspan><tspan x="410" dy="23.75">is short.</tspan></text>
<path d="M 1110 171 L 1130 171 L 1130 273 L 1110 273" fill="none" stroke="#244C51" stroke-width="3" opacity="1"/>
<text x="1150" y="203" font-size="18" fill="#263238" text-anchor="start" font-weight="500" ><tspan x="1150" dy="0">Both older bands are slightly below the city.</tspan><tspan x="1150" dy="22.5">This is not an old neighbourhood.</tspan></text>
<line x1="80" y1="868" x2="1520" y2="868" stroke="#D7D2C7" stroke-width="1" opacity="1"/>
<text x="80" y="900" font-size="17" fill="#263238" text-anchor="start" font-weight="400" ><tspan x="80" dy="0">Polygon shares are modelled. Budapest shares are counted, KSH 2022.</tspan></text>
