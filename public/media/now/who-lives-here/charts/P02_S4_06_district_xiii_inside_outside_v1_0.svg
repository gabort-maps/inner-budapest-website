<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">District XIII, inside and outside</title><desc id="desc">Paired stacked age profiles compare the study area with the rest of District XIII.</desc>
<style>text{font-family:Arial,"Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums lining-nums}.axis{shape-rendering:crispEdges}</style>
<rect x="0" y="0" width="1600" height="1000" fill="#F4F1E9" stroke="none" stroke-width="0" rx="0" opacity="1"/>
<text x="80" y="78" font-size="44" fill="#263238" text-anchor="start" font-weight="500" >District XIII, inside and outside</text>
<text x="80" y="116" font-size="23" fill="#687377" text-anchor="start" font-weight="400" >Cross the study boundary and the population changes</text>
<rect x="1350" y="52" width="170" height="44" fill="#EEE9DF" stroke="#D7D2C7" stroke-width="1" rx="22" opacity="1"/>
<text x="1435" y="82" font-size="16" fill="#263238" text-anchor="middle" font-weight="500" letter-spacing="1.4">MODELLED</text>
<text x="420" y="165" font-size="22" fill="#244C51" text-anchor="middle" font-weight="500" >Inside the polygon</text>
<text x="760" y="165" font-size="22" fill="#263238" text-anchor="middle" font-weight="500" >Rest of District XIII</text>
<rect x="325" y="205" width="190" height="55.4795" fill="#244C51" stroke="#F4F1E9" stroke-width="2" rx="0" opacity="1"/>
<text x="420.0" y="229.73975000000002" font-size="18" fill="#FFFDFA" text-anchor="middle" font-weight="500" >Under 15</text>
<text x="420.0" y="255.73975000000002" font-size="18" fill="#FFFDFA" text-anchor="middle" font-weight="400" >10.37%</text>
<rect x="325" y="260.47950000000003" width="190" height="355.561" fill="#244C51" stroke="#F4F1E9" stroke-width="2" rx="0" opacity="1"/>
<text x="420.0" y="435.26" font-size="18" fill="#FFFDFA" text-anchor="middle" font-weight="500" >15–64</text>
<text x="420.0" y="461.26" font-size="18" fill="#FFFDFA" text-anchor="middle" font-weight="400" >66.46%</text>
<rect x="325" y="616.0405000000001" width="190" height="123.9595" fill="#244C51" stroke="#F4F1E9" stroke-width="2" rx="0" opacity="1"/>
<text x="420.0" y="675.02025" font-size="18" fill="#FFFDFA" text-anchor="middle" font-weight="500" >65+</text>
<text x="420.0" y="701.02025" font-size="18" fill="#FFFDFA" text-anchor="middle" font-weight="400" >23.17%</text>
<rect x="665" y="205" width="190" height="63.076499999999996" fill="#D7D2C7" stroke="#F4F1E9" stroke-width="2" rx="0" opacity="1"/>
<text x="760.0" y="233.53825" font-size="18" fill="#263238" text-anchor="middle" font-weight="500" >Under 15</text>
<text x="760.0" y="259.53825" font-size="18" fill="#263238" text-anchor="middle" font-weight="400" >11.79%</text>
<rect x="665" y="268.0765" width="190" height="384.61150000000004" fill="#D7D2C7" stroke="#F4F1E9" stroke-width="2" rx="0" opacity="1"/>
<text x="760.0" y="457.38225" font-size="18" fill="#263238" text-anchor="middle" font-weight="500" >15–64</text>
<text x="760.0" y="483.38225" font-size="18" fill="#263238" text-anchor="middle" font-weight="400" >71.89%</text>
<rect x="665" y="652.6880000000001" width="190" height="87.31200000000001" fill="#D7D2C7" stroke="#F4F1E9" stroke-width="2" rx="0" opacity="1"/>
<text x="760.0" y="693.344" font-size="18" fill="#263238" text-anchor="middle" font-weight="500" >65+</text>
<text x="760.0" y="719.344" font-size="18" fill="#263238" text-anchor="middle" font-weight="400" >16.32%</text>
<text x="1020" y="260" font-size="46" fill="#244C51" text-anchor="start" font-weight="500" >2.23</text>
<text x="1140" y="260" font-size="19" fill="#263238" text-anchor="start" font-weight="400" >older residents per child inside</text>
<text x="1020" y="300" font-size="24" fill="#263238" text-anchor="start" font-weight="500" >1.38 outside</text>
<text x="1020" y="410" font-size="46" fill="#244C51" text-anchor="start" font-weight="500" >19,554</text>
<text x="1200" y="410" font-size="19" fill="#263238" text-anchor="start" font-weight="400" >residents per km² inside</text>
<text x="1020" y="450" font-size="24" fill="#263238" text-anchor="start" font-weight="500" >8,113 outside</text>
<text x="1020" y="565" font-size="46" fill="#244C51" text-anchor="start" font-weight="500" >2.4 times</text>
<text x="1020" y="605" font-size="20" fill="#263238" text-anchor="start" font-weight="400" >the density</text>
<line x1="80" y1="868" x2="1520" y2="868" stroke="#D7D2C7" stroke-width="1" opacity="1"/>
<text x="80" y="900" font-size="17" fill="#263238" text-anchor="start" font-weight="400" ><tspan x="80" dy="0">Both sides are modelled from the same grid, so the contrast is more reliable than either figure on its own.</tspan></text>
